[project]
name = "inkstitch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pystitch",
    "inkex @ git+https://gitlab.com/inkscape/extensions.git@EXTENSIONS_AT_INKSCAPE_1.4.1",
    "wxPython>=4.1.1",
    "networkx",
    "shapely>=2.0.0",
    "lxml",
    "platformdirs",
    "numpy==2.2.6",
    "jinja2>2.9",
    "requests",
    "tomli ; python_version < '3.11'",
    "colormath2",
    "flask>=2.2.0",
    "fonttools",
    "trimesh>=3.15.2",
    "diskcache",
    "flask-cors",
    "pywinutils ; sys_platform == 'win32'",
    "pywin32 ; sys_platform == 'win32'",
]

[project.scripts]
inkstitch = "inkstitch:main"

[dependency-groups]
dev = [
    "debugpy",
    "mypy==1.19.1",
    "flake8==7.3.0",
    "pytest",
    "types-wxpython",
    "types-appdirs",
    "types-shapely",
    "types-networkx",
    "types-lxml",
    "types-pywin32",
    "pyinstaller>=6.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lib"]
py-modules = ["inkstitch"]

[tool.hatch.build.targets.wheel.force-include]
"inkstitch.py" = "inkstitch.py"
"inx" = "lib/assets/inx"
"templates" = "lib/assets/templates"
"icons" = "lib/assets/icons"
"symbols" = "lib/assets/symbols"
"fonts" = "lib/assets/fonts"
"palettes" = "lib/assets/palettes"
"tiles" = "lib/assets/tiles"
"print" = "lib/assets/print"
"locales" = "lib/assets/locales"
"translations" = "lib/assets/translations"
"addons" = "lib/assets/addons"
"dbus" = "lib/assets/dbus"
"VERSION" = "lib/assets/VERSION"
"LICENSE" = "lib/assets/LICENSE"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["lib/**/*.py", "tests/**/*.py"]
disable_error_code = ["misc"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
disallow_subclassing_any = true
disallow_untyped_decorators = true

[[tool.mypy.overrides]]
module = "lib.elements.clone"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "colormath2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "winutils.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pystitch.*"
ignore_missing_imports = true
follow_imports = "skip"
