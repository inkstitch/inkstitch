### customize this file and save as DEBUG.toml

### ===========================================================================
### DEVELOPER CONFIGURATION
### ===========================================================================
### This file is for Ink/Stitch developers only. Regular users do not need it.
###
### Master switch - until it is enabled, every option below is ignored:
###
###     [DEBUG]
###     development_mode = true
###
### Options developers need most often:
###     [LOGGING] log_location        where the log file is written
###     [DEBUG]   create_bash_script  generate debug_inkstitch.sh for offline runs
###
### development_mode is opt-in and is never enabled automatically.
### It used to be inferred from "not running as a frozen (pyinstaller) build",
### so anybody who installed Ink/Stitch by simply unpacking an archive instead
### of using a release build silently ended up in developer mode. The log was
### then written next to inkstitch.py, which fails on a read-only installation
### directory - and the whole extension refused to start. Because developer
### mode is now explicit, a regular user never writes into the installation
### directory.
###
### When you do enable it, pick a log_location you can actually write to.
### "script" writes into the installation directory and therefore fails on
### read-only installs; "user" or an absolute path is safer.
### ===========================================================================

[LIBRARY]
### use the pip installed version of inkex.py, default: true
# prefer_pip_inkex = false

[LOGGING]
### Specifies where log files are written in developer mode.
### Options: "script" (SCRIPTDIR),
###          "document" "doc" (active SVG folder),
###          "user" "usr" (user log directory),
###          "temp" "tmp" (system temp)
###          an absolute path, e.g. "/home/user/inkstitch_log" or "~/inkstitch_log"
###           "" (default - disables logging)
### An absolute path needs no keyword - it is detected automatically and
### "~" is expanded to the home directory. A path to an existing file is
### also accepted, in which case its parent directory is used.
### Note: As any TOML string, the value must be quoted.
### Note: For regular users (development_mode = false), file logging is
### completely DISABLED unless override via INKSTITCH_LOG_DIR env variable.
# log_location = "script"

### logging configuration file, default: none - use implicit DEBUG logging to inkstitch.log
### we may have multiple configurations: LOGGING.toml, LOGGING1.toml, LOGGING2.toml, etc.
# log_config_file = "LOGGING.toml"

### Disable all logging globally using logging.disable().
### Note: This does NOT suppress warnings (e.g., from the 'warnings' module).
### To re-enable logging, call: logging.disable(0)
# disable_logging = true

[DEBUG]
### Enable developer mode (enables debug tools, profiling, and file logging).
### Default: false
# development_mode = true

### select one active debug_type, default: "none"
# debug_type = "vscode"
# debug_type = "pycharm"
# debug_type = "pydev"

### enable debugger, see cmd line arg -d, default: false
# debug_enable = true

### disable debugger when calling from inkscape, default: false
# disable_from_inkscape = true

### creation of bash script, default: false
# create_bash_script = true

### base name for bash script, default: "debug_inkstitch"
# bash_file_base = "debug_inkstitch"

### enable sew_stack elements, default: false
# enable_sew_stack = true

[PROFILE]
### select one active profiler_type, default: "none"
# profiler_type = "cprofile"
# profiler_type = "profile"
# profiler_type = "pyinstrument"
# profiler_type = "time"
# profiler_type = "monkeytype"

### enable profiler, see cmd line arg -p, default: false
# profile_enable = true

### base name for profile output files, default: "debug_profile"
# profile_file_base = "log/debug_profile"

